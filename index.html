<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Will You Go On A Date?</title>
<style>
  :root{
    --pink-light:#ffe0ec;
    --pink-mid:#ffb6d5;
    --pink-hot:#ff5da2;
    --pink-deep:#e0468b;
    --text-dark:#7a2455;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family: 'Segoe UI', Verdana, sans-serif;
    background: linear-gradient(180deg, var(--pink-light), var(--pink-mid));
  }
  .screen{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    opacity:0; pointer-events:none; transition: opacity .5s ease;
  }
  .screen.active{ opacity:1; pointer-events:auto; }

  h1{
    color:var(--pink-deep);
    font-size:clamp(1.6rem, 6vw, 2.6rem);
    text-shadow: 2px 2px 0 #fff, 4px 4px 8px rgba(224,70,139,0.3);
    margin-bottom: 8px;
    z-index: 5;
  }
  p.line{
    color: var(--text-dark);
    font-size: clamp(1.2rem, 5vw, 1.8rem);
    margin: 6px 0;
    z-index: 5;
    font-weight: 600;
  }
  .btn-row{
    position: relative;
    display:flex; gap:20px; margin-top: 30px;
    width: 100%; max-width: 400px;
    justify-content:center;
    height: 70px;
    z-index: 5;
  }
  button{
    border:none; border-radius: 50px;
    padding: 14px 30px;
    font-size: 1.1rem;
    font-weight:bold;
    cursor:pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    touch-action: manipulation;
  }
  #yesBtn{
    background: linear-gradient(135deg, var(--pink-hot), var(--pink-deep));
    color:#fff;
    transition: transform .2s ease;
  }
  #yesBtn:active{ transform: scale(0.95); }
  #noBtn{
    background:#fff;
    color: var(--pink-deep);
    border: 2px solid var(--pink-hot);
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transition: left .18s ease, top .18s ease;
  }

  .emoji-big{
    font-size: clamp(2.5rem, 10vw, 4rem);
    margin-bottom: 10px;
    z-index:5;
  }

  /* Falling flowers */
  .petal{
    position: fixed;
    top: -40px;
    pointer-events: none;
    user-select: none;
    z-index: 1;
    animation-name: fall, sway;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite;
  }
  @keyframes fall{
    from{ transform: translateY(-10vh); }
    to{ transform: translateY(110vh); }
  }
  @keyframes sway{
    0%,100%{ margin-left:0; }
    50%{ margin-left: 40px; }
  }

  .sparkle{
    position:absolute;
    z-index:2;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:.5; transform: scale(0.9);}
    50%{ opacity:1; transform: scale(1.15);}
  }
</style>
</head>
<body>

<div id="petals"></div>

<div class="screen active" id="screen1">
  <div class="emoji-big">🌸💗🌸</div>
  <h1 id="titleText">Will you go on a date with Krish?</h1>
  <div class="btn-row">
    <button id="yesBtn">Yes 💕</button>
    <button id="noBtn">No</button>
  </div>
</div>

<div class="screen" id="screen2">
  <div class="emoji-big">🎉🌷🎉</div>
  <p class="line">Congratulations you are in for a big surprise!!</p>
  <p class="line">Further details will provided to you on instagram. Thank you for participating!</p>
</div>

<script>
  // ---------- Falling flower petals ----------
  const petalEmojis = ["🌸","🌷","💮","🌺","✿","❀"];
  const petalContainer = document.getElementById('petals');
  const numPetals = 22;

  for(let i=0;i<numPetals;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = petalEmojis[Math.floor(Math.random()*petalEmojis.length)];
    const size = 14 + Math.random()*22;
    p.style.fontSize = size + 'px';
    p.style.left = Math.random()*100 + 'vw';
    const fallDuration = 6 + Math.random()*8;
    const swayDuration = 2 + Math.random()*3;
    p.style.animationDuration = fallDuration + 's, ' + swayDuration + 's';
    p.style.animationDelay = (Math.random()*8) + 's, ' + (Math.random()*2) + 's';
    p.style.opacity = 0.6 + Math.random()*0.4;
    petalContainer.appendChild(p);
  }

  // ---------- Dodging No button ----------
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const btnRow = document.querySelector('.btn-row');

  function moveNoButton(){
    const rowRect = btnRow.getBoundingClientRect();
    const btnW = noBtn.offsetWidth;
    const btnH = noBtn.offsetHeight;
    const margin = 10;

    // Move relative to viewport so it can run anywhere on screen, not just inside row
    const maxX = window.innerWidth - btnW - margin;
    const maxY = window.innerHeight - btnH - margin;
    const randX = margin + Math.random() * (maxX - margin);
    const randY = margin + Math.random() * (maxY - margin);

    // Switch to fixed positioning relative to viewport after first dodge
    noBtn.style.position = 'fixed';
    noBtn.style.left = randX + 'px';
    noBtn.style.top = randY + 'px';
    noBtn.style.transform = 'none';
  }

  // Trigger dodge on hover (desktop) AND on touchstart / pointerdown (mobile taps)
  // so tapping it never actually "clicks" it — it runs away first.
  ['pointerenter','pointerdown','touchstart','mouseover'].forEach(evt=>{
    noBtn.addEventListener(evt, function(e){
      e.preventDefault();
      moveNoButton();
    }, {passive:false});
  });

  // Safety: if somehow a click sneaks through, still dodge instead of doing nothing bad
  noBtn.addEventListener('click', function(e){
    e.preventDefault();
    moveNoButton();
  });

  // ---------- Yes button goes to screen 2 ----------
  yesBtn.addEventListener('click', function(){
    document.getElementById('screen1').classList.remove('active');
    document.getElementById('screen2').classList.add('active');
  });
</script>

</body>
</html>
